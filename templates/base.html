<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cybersecurity Log Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">&#128737; Cybersecurity Log Monitoring</span>
    <ul class="navbar-nav me-auto">
      {% for name, endpoint, label in [('dashboard','dashboard','Dashboard'),('logs','logs','Logs'),('alerts','alerts','Alerts'),('login','login','Demo login')] %}
      <li class="nav-item"><a class="nav-link {{ 'active' if page == name }}" href="{{ url_for(endpoint) }}">{{ label }}</a></li>
      {% endfor %}
    </ul>
    <span class="badge {{ 'bg-success' if store.is_cloud else 'bg-warning text-dark' }}">Storage: {{ store.label }}</span>
  </div>
</nav>
<main class="container pb-5">{% block content %}{% endblock %}</main>
</body>
</html>
